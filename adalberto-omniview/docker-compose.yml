version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: adalberto-omniview_server_1
      APP_PORT: 8787
      # O OmniView tem login próprio (necessário para os apps de celular/desktop acessarem a API).
      PROXY_AUTH_ADD: "false"

  server:
    image: ghcr.io/adalbertosj/omniview-server:1.5.0
    restart: on-failure
    stop_grace_period: 15s
    device_cgroup_rules:
      - "c 81:* rmw"
    environment:
      GO2RTC_URL: http://adalberto-omniview_go2rtc_1:1984
      GO2RTC_RTSP: rtsp://adalberto-omniview_go2rtc_1:8554
      GO2RTC_CONFIG: /go2rtc/go2rtc.yaml
      WEBRTC_PORT: 8555
      AI_URL: http://adalberto-omniview_ai_1:5000
      AI_SECRET: ${APP_SEED}
      # Locais que podem ser escolhidos para as gravações (Ajustes › Armazenamento)
      STORAGE_ROOTS: "/storage/arquivos=Arquivos do Umbrel,/storage/externo=Discos externos,/storage/rede=Rede (NAS)"
    volumes:
      - ${UMBREL_ROOT}/home:/storage/arquivos
      - ${UMBREL_ROOT}/external:/storage/externo:rslave
      - ${UMBREL_ROOT}/network:/storage/rede:rslave
      - ${APP_DATA_DIR}/data/server:/data
      - ${APP_DATA_DIR}/data/recordings:/recordings
      - ${APP_DATA_DIR}/data/go2rtc:/go2rtc
      # Ajustes das webcams USB (só os dispositivos de vídeo, pela regra device_cgroup_rules)
      - /dev:/dev
      # Lista das placas de som do servidor (o Docker esconde /proc/asound dentro dos contêineres)
      - /proc/asound:/host/asound:ro

  go2rtc:
    image: alexxit/go2rtc:1.9.14
    restart: on-failure
    # Acesso às webcams USB conectadas ao Umbrel (/dev/video*).
    privileged: true
    ports:
      # WebRTC (vídeo ao vivo de baixa latência para os apps na Tailnet)
      - 8555:8555/tcp
      - 8555:8555/udp
    volumes:
      - ${APP_DATA_DIR}/data/go2rtc:/config
      # /dev ao vivo: webcams ligadas depois do início também aparecem
      - /dev:/dev

  ai:
    image: ghcr.io/adalbertosj/omniview-ai:1.5.0
    restart: on-failure
    environment:
      OMNIVIEW_URL: http://adalberto-omniview_server_1:8787
      AI_SECRET: ${APP_SEED}
    volumes:
      - ${APP_DATA_DIR}/data/ai:/data
