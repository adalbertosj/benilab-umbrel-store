manifestVersion: 1
id: adalberto-endoscope-ponte
category: files
name: EndoScope Ponte
version: "1.4.0"
tagline: Leva a placa de captura deste servidor para o seu EndoScope
description: >-
  Instale a Ponte no computador (com Umbrel) que fica perto da torre de endoscopia e ligue nele a
  placa de captura ou a câmera USB. No EndoScope principal (Fontes › Nova fonte › De uma Ponte),
  adicione essa placa: ela passa a aparecer na tela Captura de qualquer aparelho da Tailnet.


  A Ponte só transmite a imagem para o EndoScope principal, protegida por senha. Fotos, vídeos e
  exames ficam no servidor principal.


  Ao abrir este app aparece a página da Ponte com o endereço deste servidor e as placas detectadas.
releaseNotes: >-
  Sem mudanças na Ponte do Umbrel; acompanha a versão 1.4.0 do EndoScope (Ponte também em Mac e Windows).
