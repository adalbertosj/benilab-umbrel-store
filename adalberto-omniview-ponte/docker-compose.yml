version: "3.7"

services:
  app_proxy:
    environment:
      # A página da Ponte abre direto (não mostra a senha; ela aparece nas credenciais do Umbrel).
      APP_HOST: adalberto-omniview-ponte_web_1
      APP_PORT: 8080
      PROXY_AUTH_ADD: "false"

  web:
    image: ghcr.io/adalbertosj/omniview-server:1.3.1
    restart: on-failure
    command: ["node", "src/ponte.js"]
    environment:
      PONTE_SENHA: ${APP_PASSWORD}
      GO2RTC_URL: http://adalberto-omniview-ponte_go2rtc_1:1984
      NOME: ${DEVICE_HOSTNAME}
      AUDIO_CONFIG: /config/omniview-audio.yaml
      VERSAO: "1.3.1"
    ports:
      # Microfones e alto-falantes deste servidor para o OmniView principal (com a senha da Ponte)
      - 8792:8080
    volumes:
      - ${APP_DATA_DIR}/data:/config
      - /proc/asound:/host/asound:ro

  go2rtc:
    image: alexxit/go2rtc:1.9.14
    restart: on-failure
    # Acesso às webcams USB e à câmera embutida do notebook (/dev/video*).
    privileged: true
    # A segunda configuração liga a senha na API e no RTSP; streams criados pelo OmniView ficam
    # gravados em /config/go2rtc.yaml.
    command:
      - go2rtc
      - -config
      - /config/go2rtc.yaml
      - -config
      - /config/omniview-audio.yaml
      - -config
      - '{"api": {"listen": ":1984", "username": "omniview", "password": "${APP_PASSWORD}", "origin": "*"}, "rtsp": {"listen": ":8554", "username": "omniview", "password": "${APP_PASSWORD}"}, "webrtc": {"listen": ""}}'
    ports:
      # API (o OmniView principal lista as câmeras e cria o stream) e RTSP (o vídeo), ambos com senha
      - 8791:1984
      - 8564:8554
    volumes:
      - ${APP_DATA_DIR}/data:/config
      # /dev ao vivo: webcams ligadas depois do início também aparecem
      - /dev:/dev
