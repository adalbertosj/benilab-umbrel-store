manifestVersion: 1
id: adalberto-omniview-ponte
category: automation
name: OmniView Ponte
version: "1.3.1"
tagline: Leva as câmeras deste servidor para o seu OmniView
description: >-
  Instale a Ponte em cada servidor que tem câmera — webcam USB ou a câmera embutida de um
  notebook — e adicione essas câmeras no OmniView principal (Câmeras › Adicionar câmera ›
  Outro servidor).


  A Ponte só transmite a imagem para o OmniView, protegida por senha. Gravação, linha do tempo,
  detecção, reconhecimento facial e alertas ficam no servidor principal.


  Ao abrir este app aparece a página da Ponte com a senha, o endereço deste servidor e as câmeras
  detectadas — é só copiar para o OmniView.
releaseNotes: >-
  Acompanha a versão 1.3.1 do OmniView.
