manifestVersion: 1
id: adalberto-endoscope
category: files
name: EndoScope
version: "1.0.1"
tagline: Captura de exames endoscópicos, pacientes e laudos em PDF
description: >-
  EndoScope roda 100% no seu Umbrel: nenhum dado de paciente sai da sua rede.


  - Cadastro de pacientes e exames

  - Captura de fotos e vídeos do endoscópio (placa de captura ou câmera)

  - Laudos com modelos, logo e assinatura, gerados em PDF

  - Cadastros de hospitais, convênios, procedimentos e frases

  - Cópia dos dados para o computador ou para a nuvem


  Para trazer os dados da versão na nuvem, abra o app e acesse /local-admin.html.

  A tela de captura usa a câmera, que o navegador só libera em HTTPS (veja o README).
releaseNotes: >-
  Corrige a instalação no Umbrel: o app não conseguia gravar na pasta de dados e reiniciava em loop.
